# Supervisor Configuration for Laravel Queue Worker & Schedule
# Save to: /etc/supervisor/conf.d/laravel-worker.conf
# Run: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start all

[program:sankara-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sankara/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/sankara/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
